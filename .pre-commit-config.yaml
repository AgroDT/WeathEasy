repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        exclude: ^charts/[^/]+/templates/
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix, lf]
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: chart-generate
        name: generate chart values and documentation
        language: system
        entry: uv run --frozen python scripts/generate_chart.py
        files: ^(scripts/generate_chart\.py|charts/weatheasy/(values\.schema\.json|values\.yaml|README\.md))$
        pass_filenames: false
      - id: uv-lock
        name: uv lock
        language: system
        entry: uv
        args: [lock]
        files: (pyproject.toml|uv.lock)
        pass_filenames: false
      - id: lint
        name: lint
        language: system
        entry: uv
        args: [run, --frozen, ruff, check, src]
        pass_filenames: false
      - id: format
        name: format
        language: system
        entry: uv
        args: [run, --frozen, ruff, format, src]
        pass_filenames: false
      - id: ty
        name: ty
        language: system
        entry: uv
        args: [run, --frozen, ty, check]
        files: ^src/
        types: [file, python]
