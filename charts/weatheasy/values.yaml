# @generated by scripts/generate_chart.py; edit values.schema.json.

image:
  # Application image repository.
  repository: ghcr.io/agrodt/weatheasy
  # Image tag; empty uses Chart.appVersion.
  tag: ''
  # Kubernetes image pull policy.
  pullPolicy: IfNotPresent

# Existing image pull Secret references.
imagePullSecrets: []

# Override the chart name used in resource names.
nameOverride: ''

# Override the complete resource name (truncated to 48 characters).
fullnameOverride: ''

s3:
  # S3-compatible endpoint; empty uses the SDK default.
  endpoint: ''

# Shared downloaded-file cache for source update jobs: local directory or s3:// URI.
downloadCache: /var/lib/weatheasy/downloads

# Existing Secret/ConfigMap references for all containers.
envFrom: []

# Additional Kubernetes EnvVar entries for all containers.
extraEnv: []

serviceAccount:
  # Create a ServiceAccount.
  create: true
  # Existing or created account name; empty uses the release resource name.
  name: ''
  # Account annotations, including workload identity configuration.
  annotations: {}
  # Mount the standard Kubernetes API token.
  automountServiceAccountToken: false

# Pod security settings.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Container security settings.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
  seccompProfile:
    type: RuntimeDefault

# Node label constraints.
nodeSelector: {}

# Kubernetes scheduling tolerations.
tolerations: []

# Kubernetes affinity settings.
affinity: {}

# Annotations on API and update Pods.
podAnnotations: {}

workVolume:
  # Size limit of writable home/work directory emptyDir.
  sizeLimit: 10Gi
  # Existing PVC mounted at /var/lib/weatheasy. Required to retain working downloads across Job Pods; empty uses emptyDir.
  existingClaim: ''

tmpVolume:
  # Size limit of /tmp emptyDir.
  sizeLimit: 1Gi

api:
  # Create API Deployment and Service.
  enabled: true
  # Number of API replicas.
  replicas: 1
  # Decimal precision of API results.
  precision: 6
  # Enable application CORS.
  enableCors: false
  # API container resource requests and limits.
  resources: {}
  # Startup probe timings and thresholds; endpoint is /startupz.
  startupProbe:
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 30
    successThreshold: 1
  # Readiness probe timings and thresholds; endpoint is /readyz.
  readinessProbe:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1
  # Liveness probe timings and thresholds; endpoint is /livez.
  livenessProbe:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1

service:
  # ClusterIP, NodePort or LoadBalancer.
  type: ClusterIP
  # Service annotations, including cloud load balancer settings.
  annotations: {}
  # Service port; containers listen on port 8000.
  port: 8000

sources:
  cfs2:
    # Independent CFS2 Zarr store URI; empty disables this source.
    store: ''
    update:
      # Create the source CronJob.
      enabled: false
      # Cron schedule.
      schedule: 0 5 * * *
      # Schedule time zone.
      timeZone: Etc/UTC
      # Pause scheduled runs; does not stop active Jobs.
      suspend: false
      # Job retry limit.
      backoffLimit: 2
      # Maximum lateness for starting a scheduled run; null omits the deadline.
      startingDeadlineSeconds: null
      # Maximum total Job duration, including retries; null omits the deadline.
      activeDeadlineSeconds: null
      # Number of successful Jobs to retain.
      successfulJobsHistoryLimit: 3
      # Number of failed Jobs to retain.
      failedJobsHistoryLimit: 1
      # Download container resource requests and limits.
      resources: {}
      # Source-specific Secret/ConfigMap references, appended to global entries.
      envFrom: []
      # Source-specific EnvVar entries, appended to global entries.
      extraEnv: []
      correction:
        # Apply correction after successful download.
        enabled: false
        # Published DEM Zarr URI; required when this update and correction are enabled.
        dem: ''
        # Published model artifact directory URI; required when this update and correction are enabled.
        artifacts: ''
        # Correction container resource requests and limits.
        resources: {}
  era5:
    # Independent ERA5 Zarr store URI; empty disables this source.
    store: ''
    update:
      # Create the source CronJob.
      enabled: false
      # Cron schedule.
      schedule: 0 6 10 * *
      # Schedule time zone.
      timeZone: Etc/UTC
      # Pause scheduled runs; does not stop active Jobs.
      suspend: false
      # Job retry limit.
      backoffLimit: 2
      # Maximum lateness for starting a scheduled run; null omits the deadline.
      startingDeadlineSeconds: null
      # Maximum total Job duration, including retries; null omits the deadline.
      activeDeadlineSeconds: null
      # Number of successful Jobs to retain.
      successfulJobsHistoryLimit: 3
      # Number of failed Jobs to retain.
      failedJobsHistoryLimit: 1
      # Download container resource requests and limits.
      resources: {}
      # Source-specific Secret/ConfigMap references, appended to global entries.
      envFrom: []
      # Source-specific EnvVar entries, appended to global entries.
      extraEnv: []
      # Optional ERA5 bounding box [north, west, south, east].
      bbox: []
      correction:
        # Apply correction after successful download.
        enabled: false
        # Published DEM Zarr URI; required when this update and correction are enabled.
        dem: ''
        # Published model artifact directory URI; required when this update and correction are enabled.
        artifacts: ''
        # Correction container resource requests and limits.
        resources: {}
  cmip6:
    # Independent CMIP6 Zarr store URI; empty disables this source.
    store: ''

ingress:
  # Create an Ingress; requires API.
  enabled: false
  # Ingress controller class.
  className: ''
  # Ingress controller annotations.
  annotations: {}
  # Host/path rules; each path requires path and pathType.
  hosts:
  - host: weatheasy.example.org
    paths:
    - path: /
      pathType: Prefix
  # TLS host lists and existing Secret names.
  tls: []

httpRoute:
  # Create an HTTPRoute; requires API and installed Gateway API.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Existing Gateway references; required when enabled.
  parentRefs: []
  # Hostnames accepted by the route; empty leaves matching to the Gateway.
  hostnames: []
  # Gateway API match objects; empty matches all requests.
  matches:
  - path:
      type: PathPrefix
      value: /

# Shared Helm values; optional and unset by default.
# global:
