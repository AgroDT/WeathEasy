[build-system]
requires = ["hatchling>=1.32.3,<2", "uv-dynamic-versioning>=0.14.1,<1"]
build-backend = "hatchling.build"

[project]
name = "weatheasy"
description = "A service for easy weather data acquiring"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [
    { "name" = "Margarita Usacheva", email = "usa4eva.m@mail.ru" },
    { "name" = "Petr Tsymbarovich", email = "petr@tsymbarovich.ru" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "netcdf4~=1.7",
    "numpy>=2,<3",
    "rasterio~=1.3",
    "rioxarray>=0.19,<0.24",
    "requests~=2.32",
    "xarray>=2025.6,<2027",
    "zarr>=3.1,<4",
]

[dependency-groups]
dev = [
    "joblib-stubs>=1.5.3.1.20260117",
    "mypy~=1.11",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8.3,<9",
    "ruff~=0.7",
    "scipy-stubs>=1.18.1.1",
    "types-requests~=2.32",
]

[project.optional-dependencies]
s3 = [
    "s3fs~=2024.6",
]
web = [
    "fastapi-slim~=0.111",
    "pydantic-settings~=2.3",
    "uvicorn~=0.30",
]
prepare = [
    "cdsapi>=0.7.7,<0.8",
    "cfgrib>=0.9.15,<0.10",
    "eccodes>=2.43,<3",
    "eccodeslib>=2.43 ; sys_platform != 'win32'",
]
correction = [
    "joblib>=1.4,<2",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "xgboost>=2,<4",
]
emdna = [
    "pandas>=2.2,<3",
    "scipy>=1.14,<2",
]

[project.urls]
Homepage = "https://github.com/AgroDT/WeathEasy"
Repository = "https://github.com/AgroDT/WeathEasy.git"
Issues = "https://github.com/AgroDT/WeathEasy/issues"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.sdist]
only-include = ["src/weatheasy"]

[tool.hatch.build.hooks.version]
path = "src/weatheasy/_version.py"
template = '''
version = "{version}"
'''

[[tool.mypy.overrides]]
module = [
    "netCDF4.*",
    "cfgrib.*",
    "cdsapi.*",
    "rasterio.*",
    "s3fs.*",
    "zarr.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
show-fixes = true

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN002", "ANN003", "ANN101", "ANN102", "ANN202", "ANN401",
    "BLE001",
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D202", "D203", "D213", "D400",
    "N813",
    "PLR0913", "PLR2004",
    "RUF001", "RUF002", "RUF003",
    "TID252",
    "COM812", "ISC001", "Q000", "Q003",  # Handled by ruff format
]

[tool.ruff.lint.isort]
lines-after-imports = 2
combine-as-imports = true
known-local-folder = ["weatheasy"]

[tool.ruff.lint.flake8-quotes]
multiline-quotes = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201", "S101", "INP001"]
